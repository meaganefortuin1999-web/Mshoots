<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Through Meagan's Lenses</title>

<meta name="description" content="Through Meagan's Lenses | Moments Framed. Memories Treasured. Professional photography by Meagan Fortuin.">

<style>

:root{
    --deep:#1b0033;
    --purple:#7b1fa2;
    --pink:#ff5fa2;
    --green:#10b981;
    --white:#ffffff;
    --card:rgba(255,255,255,0.08);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Segoe UI',sans-serif;
    color:white;
    background:
    radial-gradient(circle at top left, rgba(255,95,162,.18), transparent 30%),
    linear-gradient(135deg,var(--deep),var(--purple),var(--pink));
    min-height:100vh;
}

.container{
    max-width:1200px;
    margin:auto;
    padding:25px;
}

.hero{
    text-align:center;
    padding:80px 20px;
}

.badge{
    display:inline-block;
    padding:10px 18px;
    border-radius:999px;
    background:linear-gradient(90deg,var(--purple),var(--pink));
    font-weight:bold;
}

.hero h1{
    margin-top:20px;
    font-size:3rem;
}

.hero p{
    margin-top:10px;
    font-size:1.2rem;
}

.tabs{
    display:flex;
    justify-content:center;
    gap:12px;
    flex-wrap:wrap;
    margin-bottom:25px;
}

.tab-btn{
    padding:12px 20px;
    border:none;
    border-radius:999px;
    cursor:pointer;
    font-weight:bold;
    background:rgba(255,255,255,0.1);
    color:white;
}

.tab-btn.active{
    background:linear-gradient(90deg,var(--purple),var(--pink));
}

.card{
    background:var(--card);
    backdrop-filter:blur(10px);
    padding:25px;
    border-radius:18px;
    margin-bottom:25px;
}

h2{
    margin-bottom:15px;
}

.gallery{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:15px;
}

.gallery img{
    width:100%;
    height:280px;
    object-fit:cover;
    border-radius:12px;
    cursor:pointer;
    transition:0.3s;
}

.gallery img:hover{
    transform:scale(1.03);
}

.packages{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:15px;
}

.package{
    background:rgba(0,0,0,0.2);
    padding:20px;
    border-radius:15px;
}

.package ul{
    padding-left:20px;
    margin-top:10px;
}

.package li{
    margin-bottom:8px;
}

.testimonials{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:15px;
}

.testimonial{
    background:rgba(0,0,0,.2);
    padding:20px;
    border-radius:15px;
}

.contact{
    display:flex;
    flex-direction:column;
    gap:15px;
}

.btn{
    width:fit-content;
    text-decoration:none;
    color:white;
    font-weight:bold;
    padding:12px 20px;
    border-radius:999px;
}

.whatsapp{
    background:#10b981;
}

.instagram{
    background:#E4405F;
}

.booking-frame{
    width:100%;
    height:750px;
    border:none;
    border-radius:15px;
}

footer{
    text-align:center;
    padding:25px;
    opacity:0.9;
}

.lightbox{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.95);
    justify-content:center;
    align-items:center;
    z-index:9999;
}

.lightbox img{
    max-width:90%;
    max-height:90%;
    border-radius:15px;
}

@media(max-width:768px){

.hero h1{
    font-size:2rem;
}

.booking-frame{
    height:650px;
}

}

</style>
</head>

<body>

<div class="container">

<header class="hero">

<div class="badge">
Through Meagan's Lenses
</div>

<h1>Moments Framed. Memories Treasured.</h1>

<p>Professional Photography by Meagan Fortuin</p>

</header>

<div class="tabs">

<button class="tab-btn active" id="overviewBtn">
Portfolio
</button>

<button class="tab-btn" id="bookingBtn">
Book a Session
</button>

</div>

<div id="overview">

<section class="card">

<h2>About Me</h2>

<p>
